# wristwork configuration — copy to config.properties (gitignored) and fill in.
# Every key is read at build time by app/build.gradle.kts and injected into BuildConfig,
# and by the tools/ scripts via `source`-style parsing. Never commit config.properties.

# ntfy server base URL, no trailing slash. LAN-only until the bus is published; a LAN address
# works ONLY inside the house, which is why the watch goes stale the moment it leaves (2026-08-25).
# The remote-reachable form is a hostname fronted by the existing Cloudflare tunnel.
NTFY_BASE_URL=https://bus.example.com

# ntfy access token (`ntfy token add`), REQUIRED once the bus is reachable from the internet:
# the server runs auth-default-access=deny-all and every client sends `Authorization: Bearer ...`.
# Empty = no auth header sent (LAN-only mode). Never commit a real value.
NTFY_TOKEN=
# Second token for everything that is not the watch (rig stats, canary, printer poller, Claude
# Code hook). Separate so one can be revoked without silencing the other.
NTFY_TOKEN_SVC=

# Topic names. On a private tailnet server these are plain words; on ntfy.sh they MUST be
# >= 24 random characters because the topic name is the only secret.
TOPIC_TAGS=tags        # watch -> server: state labels (Component A). Raw, immutable.
TOPIC_AGENTS=agents    # Claude Code hooks -> phone/watch: "done: {project}" / "needs input"
TOPIC_RIG=rig          # rig stats timer -> watch
TOPIC_PRINTER=printer  # PrusaLink poller -> watch
TOPIC_ACKS=acks        # watch -> hook: agents-frame opens; silences repeat notifications
TOPIC_FLAGS=flags      # watch listener -> archive: Fitbit body-response flags + notification log
TOPIC_HEALTH=health    # watch -> archive: passive HR + skin temp raw stream
TOPIC_PROMPTS=prompts  # rig -> watch: "answer the grid now" prompts (detector design)

# --- server-side / tools only (not compiled into the APK) ---
# SSH alias for the RAID server (from ~/.ssh/config). Hosts ntfy, labels.jsonl, printer poller.
RAID_SSH_HOST=raid
# SSH alias for the rig (compute box). Hosts the stats timer; receives the nightly labels mirror.
RIG_SSH_HOST=rig
# Where labels.jsonl lives on the RAID server and where it is mirrored on the rig.
LABELS_PATH_RAID=/srv/wristwork/labels.jsonl
LABELS_PATH_RIG=/home/user/wristwork/labels.jsonl

# Prusa CORE One, PrusaLink (stock firmware). Hostname/IP on the LAN; API key from the printer screen.
PRINTER_HOST=prusa.local
PRINTER_API_KEY=

# Minutes between a caught body-response flag and our own tag-it cue (HEALTH_DESIGN.md).
CUE_DELAY_MIN=30
